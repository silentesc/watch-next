server {
    listen 80;
    listen [::]:80;
    server_name watch-next.example.com;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name watch-next.example.com;

    ssl_certificate     /etc/letsencrypt/live/watch-next.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/watch-next.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5657;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
