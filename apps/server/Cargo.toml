[package]
name = "watch-next-server"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "time", "uuid"] }
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
